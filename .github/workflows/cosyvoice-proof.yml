name: cosyvoice-proof
# Whisper word-proof of the cosyvoice-test clips (CosyVoice 3 CV3_R*.wav and KittenTTS KT_*.wav) against Psalm 23:1-3 KJV.
# Words only. The voice choice is Neko's, by ear. Reads the draft release `tag`, writes PROOF.json back to it.
on:
  workflow_dispatch:
    inputs:
      tag: {description: "draft release holding the wavs", required: true, default: "cv3"}
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p wavs out
          gh release download "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" -p 'CV3_R*.wav' -p 'KT_*.wav' -D wavs
          ls -la wavs
          pip install -q faster-whisper
          python tools/voice-test/proof.py 2>&1 | tee out/PROOF.log
          gh release upload "${{ inputs.tag }}" out/PROOF.json out/PROOF.log --clobber -R "$GITHUB_REPOSITORY"
