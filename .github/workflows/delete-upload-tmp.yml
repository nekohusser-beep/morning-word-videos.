name: delete-upload-tmp
# One-off: deletes only the temp branch upload-tmp (spare split copies of John/Proverbs). Neko okayed Oct 17, 2026.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  del:
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/upload-tmp" && echo deleted
