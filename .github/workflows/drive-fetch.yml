name: drive-fetch
on:
  workflow_dispatch:
    inputs:
      tag: {description: "release tag", required: true, default: "inbox"}
      id: {description: "Drive file id", required: true}
      name: {description: "output file name", required: true}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: pip install gdown
      - run: |
          mkdir -p out
          gdown --fuzzy "https://drive.google.com/uc?id=${{ inputs.id }}" -O "out/${{ inputs.name }}"
          ls -la out
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,duration -of default=nw=1 "out/${{ inputs.name }}" || true
      - run: |
          gh release view "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" --draft --title "${{ inputs.tag }}" --notes inbox
          gh release upload "${{ inputs.tag }}" "out/${{ inputs.name }}" -R "$GITHUB_REPOSITORY" --clobber
