name: enhance
# Speech enhancement (DeepFilterNet) for the Derrick clips; reads wavs from a branch, writes results to a release.
on:
  workflow_dispatch:
    inputs:
      branch: {description: "branch holding tools/enhance/in", required: true, default: "media-enh"}
      tag: {description: "release for the outputs", required: true, default: "enhance"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.branch }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          pip install -q "torch==2.0.1" "torchaudio==2.0.2" --index-url https://download.pytorch.org/whl/cpu
          pip install -q deepfilternet "numpy<2" soundfile
      - name: Enhance
        run: |
          mkdir -p out
          for f in tools/enhance/in/*.wav; do deepFilter -o out "$f" > df.log 2>&1 || { echo "::error::failed $f: $(tail -c 600 df.log | tr '\n' ' ')"; exit 1; }; done
          ls -la out
          cd out && zip -q ../dfn3.zip *.wav && cd ..
      - name: Publish
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git fetch -q origin main && git checkout -q origin/main -- tools/rel.sh
          bash tools/rel.sh ensure "${{ inputs.tag }}" public > /dev/null
          bash tools/rel.sh up "${{ inputs.tag }}" dfn3.zip
