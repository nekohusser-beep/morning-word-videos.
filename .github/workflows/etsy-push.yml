name: etsy-push
# Our own AnythingMCP for Etsy: push a job file into tools/etsy-push/queue/ and it applies itself.
on:
  push:
    branches: [main]
    paths: ["tools/etsy-push/queue/*.json"]
  workflow_dispatch:
    inputs:
      mode:
        description: "apply = run the queue, check = vault + sign-in test, signin_link = make the Etsy sign-in link, signin_finish = finish with the address you landed on"
        required: true
        default: check
        type: choice
        options: [apply, check, signin_link, signin_finish]
      landed_url:
        description: "signin_finish only: the full address bar after tapping Allow on Etsy"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: etsy-push
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VAULT_KEY: ${{ secrets.VAULT_KEY }}
      MODE: ${{ inputs.mode || 'apply' }}
      LANDED_URL: ${{ inputs.landed_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/etsy-push
            reports/etsy-push
      - run: pip install -q requests cryptography
      - name: Run
        shell: bash
        run: |
          mkdir -p reports/etsy-push
          OUT="reports/etsy-push/run-${{ github.run_id }}-$MODE.txt"
          python3 -u tools/etsy-push/etsy_push.py "$MODE" 2>&1 | tee "$OUT"
          exit "${PIPESTATUS[0]}"
      - name: Commit the report
        if: always()
        shell: bash
        run: |
          git config user.name "etsy-push-bot"; git config user.email "noreply@github.com"
          git add reports/etsy-push || true
          git commit -q -m "etsy-push report ${{ github.run_id }} $MODE" || exit 0
          for i in 1 2 3 4 5; do git fetch -q --depth=20 origin main && git rebase -q origin/main && git push -q && break; sleep 3; done
