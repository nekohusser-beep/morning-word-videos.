name: fetch-branch
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "temp branch to commit files to (delete after pulling)"
        required: true
        type: string
      urls:
        description: "name|url pairs, one per line"
        required: true
        type: string
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URLS: ${{ inputs.urls }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and commit to temp branch
        shell: bash
        run: |
          set -e
          git checkout --orphan "$BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p files
          printf '%s\n' "$URLS" > list.txt
          while IFS='|' read -r name url; do
            name="$(echo "$name" | xargs)"; url="$(echo "$url" | xargs)"
            [ -z "$name" ] && continue
            echo "fetching $name"
            curl -fsSL --retry 3 -A "Mozilla/5.0" -o "files/$name" "$url"
          done < list.txt
          rm -f list.txt
          ls -la files
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add files
          git commit -m "fetched files"
          git push -f origin "$BRANCH"
