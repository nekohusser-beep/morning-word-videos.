name: free-gen-probe
# Tries free video generators (HF Spaces, no-key endpoints, HF inference) from the runner and saves what each produced
# to a draft release so the quality can be judged. Free runner minutes, no credits.
on:
  workflow_dispatch:
    inputs:
      candidates: {description: "repo path to candidates JSON", required: true, default: "tools/free-gen/candidates.json"}
      prompt: {description: "test prompt", required: true, default: "A simple colorful cartoon stick figure walking across green hills at sunrise, flat 2D animation, smooth motion"}
      image: {description: "repo path to a start image for image-to-video, or blank", required: false, default: "tools/scene-engine/sample_adhd/first_frame.png"}
      per_sec: {description: "seconds allowed per candidate", required: true, default: "600"}
      tag: {description: "draft release tag", required: true, default: "free-gen"}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: pip install -q gradio_client huggingface_hub
      - name: Probe
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          IMG="${{ inputs.image }}"; [ -f "$IMG" ] || IMG=""
          python3 tools/free-gen/probe.py "${{ inputs.candidates }}" out --prompt "${{ inputs.prompt }}" --image "$IMG" --per-sec "${{ inputs.per_sec }}" 2>&1 | tee out/log.txt || true
      - name: Publish
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p out; cd out
          for d in */; do n=${d%/}; [ -d "$n" ] && (cd "$n" && for f in *; do [ -f "$f" ] && mv "$f" "../${n}__$f"; done) ; done
          cd ..
          ls -la out
          bash tools/rel.sh ensure "${{ inputs.tag }}" > /dev/null
          bash tools/rel.sh up "${{ inputs.tag }}" out/report.json out/log.txt out/*__* || true
