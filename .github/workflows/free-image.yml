name: free-image
# Free still images on a runner (Pollinations, no key). Reads <file> {ref, style, shots{name: prompt}}; tries kontext (edits the ref, keeps characters) then flux. Commits PNGs to <out>.
on:
  workflow_dispatch:
    inputs:
      file: {description: "prompts json", required: true, default: "tools/skip-voice/ep6/art_prompts.json"}
      out: {description: "output folder", required: true, default: "tools/skip-voice/ep6/art"}
      seeds: {description: "seeds per shot, comma list", required: false, default: "11,22"}
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          mkdir -p "${{ inputs.out }}"
          python3 - "${{ inputs.file }}" "${{ inputs.out }}" "${{ inputs.seeds }}" <<'PY'
          import json, sys, time, urllib.parse, urllib.request
          cfg = json.load(open(sys.argv[1])); out = sys.argv[2]; seeds = sys.argv[3].split(",")
          log = open(f"{out}/gen.log", "a")
          def get(url, path):
              for a in range(3):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=180)
                      b = r.read(); ct = r.headers.get("content-type", "")
                      if ct.startswith("image") and len(b) > 20000:
                          open(path, "wb").write(b); return f"ok {len(b)}"
                      msg = f"bad {ct} {b[:160]!r}"
                  except Exception as e:
                      msg = f"err {e}"
                  time.sleep(8)
              return msg
          for name, p in cfg["shots"].items():
              prompt = urllib.parse.quote(p + " " + cfg["style"])
              for s in seeds:
                  for model in ("kontext", "flux"):
                      q = f"width=576&height=1024&nologo=true&private=true&seed={s}&model={model}"
                      if model == "kontext": q += "&image=" + urllib.parse.quote(cfg["ref"], safe="")
                      res = get(f"https://image.pollinations.ai/prompt/{prompt}?{q}", f"{out}/{name}_{model}_{s}.jpg")
                      print(name, s, model, res, flush=True); log.write(f"{name} {s} {model} {res}\n")
                      if res.startswith("ok"): break
          PY
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add "${{ inputs.out }}"; git commit -qm "free-image -> ${{ inputs.out }}" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 4; done
