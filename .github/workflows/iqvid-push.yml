name: iqvid-push
# Push a branch named iqv-* with tools/iqvid/push_job.txt (line1 mode, line2 queries, line3 opts) -> report committed back to that branch.
on:
  push:
    branches: ['iqv-*']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          mkdir -p reports/iqvid
          MODE=$(sed -n 1p tools/iqvid/push_job.txt); QUERY=$(sed -n 2p tools/iqvid/push_job.txt); OPTS=$(sed -n 3p tools/iqvid/push_job.txt)
          python3 tools/iqvid/iqvid.py "$MODE" "$QUERY" --out "reports/iqvid/push-${GITHUB_REF_NAME}" $OPTS
          git config user.name iqvid-bot; git config user.email actions@users.noreply.github.com
          git add reports/iqvid && git commit -qm "iqvid push report [skip ci]" && git push -q origin HEAD:${GITHUB_REF_NAME}
