name: nia-voice-audition
# Free designed-voice audition for Nia (Big Skip at-home, Skip's wife) (Qwen3-TTS VoiceDesign + VoxCPM2). No real person cloned.
on:
  workflow_dispatch:
    inputs:
      tag: {description: "draft release for outputs", required: true, default: "nia1"}
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release view "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" || gh release create "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" --draft -t nia-voice-audition -n "Nia voice audition"
  qwen:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: NIA-Q1, who: nia, instruct: "A warm, playful Black woman in her early thirties from North Carolina, Skip's wife. Sweet and sly, plays innocent while she sneaks his fries, light teasing laugh in her voice, natural everyday talk, not a narrator."}
          - {id: NIA-Q2, who: nia, instruct: "A warm, playful Black woman in her early thirties from North Carolina, Skip's wife. Sweet and sly, plays innocent while she sneaks his fries, light teasing laugh in her voice, natural everyday talk, not a narrator. Slightly lower and smoother, more sass."}
          - {id: NIA-Q3, who: nia, instruct: "A warm, playful Black woman in her early thirties from North Carolina, Skip's wife. Sweet and sly, plays innocent while she sneaks his fries, light teasing laugh in her voice, natural everyday talk, not a narrator. Brighter and quicker, more giggly."}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg sox libsndfile1 >/dev/null
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q qwen-tts soundfile numpy faster-whisper==1.0.3
          mkdir -p out
      - env: {INSTRUCT: "${{ matrix.instruct }}", TEXT_JSON: "tools/skip-voice/${{ matrix.who }}.json"}
        run: python tools/verse-voice/eng_qwen.py "${{ matrix.id }}" 2>&1 | tee out/${{ matrix.id }}.log
      - env: {TEXT_JSON: "tools/skip-voice/${{ matrix.who }}.json"}
        run: python tools/verse-voice/check.py out/${{ matrix.id }}.wav 2>&1 | tee out/${{ matrix.id }}.check.txt
      - if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release upload "${{ inputs.tag }}" out/* --clobber -R "$GITHUB_REPOSITORY"
  voxcpm:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: NIA-V1, who: nia, desc: "A warm, playful Black woman in her early thirties, sweet and sly, plays innocent with a light teasing laugh"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg libsndfile1 >/dev/null
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q voxcpm soundfile numpy faster-whisper==1.0.3
          mkdir -p out
      - env: {DESC: "${{ matrix.desc }}", TEXT_JSON: "tools/skip-voice/${{ matrix.who }}.json"}
        run: python tools/verse-voice/eng_voxcpm.py "${{ matrix.id }}" 2>&1 | tee out/${{ matrix.id }}.log
      - env: {TEXT_JSON: "tools/skip-voice/${{ matrix.who }}.json"}
        run: python tools/verse-voice/check.py out/${{ matrix.id }}.wav 2>&1 | tee out/${{ matrix.id }}.check.txt
      - if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release upload "${{ inputs.tag }}" out/* --clobber -R "$GITHUB_REPOSITORY"
