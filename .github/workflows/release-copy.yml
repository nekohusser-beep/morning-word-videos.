name: release-copy
# Copy assets from one release to another (e.g. from a draft into the public video release).
on:
  workflow_dispatch:
    inputs:
      from_tag: {required: true}
      to_tag: {required: true}
      pattern: {description: "regex for asset names", required: true}
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: tools}
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          bash tools/rel.sh down "${{ inputs.from_tag }}" files "${{ inputs.pattern }}"
          ls -la files
          bash tools/rel.sh up "${{ inputs.to_tag }}" files/* 2> up.err || { echo "::error::$(head -c 300 up.err)"; exit 1; }
          echo "::notice::copied $(ls files | tr '\n' ' ')"
