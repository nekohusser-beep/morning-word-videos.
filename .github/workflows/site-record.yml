name: site-record
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'JSON list [{"name":"x","url":"https://..","secs":12}]'
        required: true
      tag:
        description: 'folder under tmp/rec'
        required: true
permissions:
  contents: write
jobs:
  rec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/site-record
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cd tools/site-record
          npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          JOBS='${{ inputs.jobs }}' node record.js
          rm -rf rec/raw
          ls -la rec
      - run: |
          mkdir -p tmp/rec/${{ inputs.tag }}
          mv tools/site-record/rec/* tmp/rec/${{ inputs.tag }}/
          git config user.name "site-record bot"; git config user.email "actions@github.com"
          git sparse-checkout add tmp/rec
          git add tmp/rec/${{ inputs.tag }}
          git commit -m "tmp: site-record ${{ inputs.tag }}"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
