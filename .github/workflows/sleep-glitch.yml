name: sleep-glitch
# Pacing / mid-verse pause / click / garble scan of every rendered chapter.
# Writes glitch-<i>.json reports to the release that holds the FLACs. Does not change any audio.
on:
  workflow_dispatch:
    inputs:
      book: {description: "Bible book file name, e.g. John", required: true}
      tag: {description: "release tag holding the FLACs", required: true}
      chunks: {description: "parallel chunks", required: true, default: "10"}
      model: {description: "whisper model", required: true, default: "medium.en"}
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      idx: ${{ steps.p.outputs.idx }}
    steps:
      - id: p
        run: python3 -c "import json;print('idx='+json.dumps(list(range(int('${{ inputs.chunks }}')))))" >> $GITHUB_OUTPUT
  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJson(needs.plan.outputs.idx) }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: tools}
      - name: Setup
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          sleep $(( ${{ matrix.i }} * 4 ))
          sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q faster-whisper==1.0.3 soundfile numpy 2>&1 | tail -1 || true
          curl -sSL --retry 5 -o "${{ inputs.book }}.json" "https://raw.githubusercontent.com/aruljohn/Bible-kjv/master/${{ inputs.book }}.json"
          mkdir -p flac
          R=${{ github.repository }}
          RID=$(gh api "repos/$R/releases?per_page=100" --jq '.[]|select(.tag_name=="${{ inputs.tag }}")|.id' | head -1)
          (gh api --paginate "repos/$R/releases/$RID/assets?per_page=100" --jq '.[]|select(.name|endswith(".flac"))|[.name,.id]|@tsv') | sort > all.tsv
          awk -v i=${{ matrix.i }} -v n=${{ inputs.chunks }} '(NR-1)%n==i' all.tsv > mine.tsv
          echo "assets $(wc -l < all.tsv), mine $(wc -l < mine.tsv)"
          while IFS=$'\t' read name id; do
            for t in 1 2 3 4 5; do
              gh api -H "Accept: application/octet-stream" "repos/$R/releases/assets/$id" > "flac/$name" && [ -s "flac/$name" ] && break
              echo "retry $name"; sleep $((t*10))
            done
            [ -s "flac/$name" ] || { echo "::error::could not download $name"; exit 1; }
          done < mine.tsv
      - name: Scan
        run: |
          python3 tools/sleep_glitch.py "${{ inputs.book }}.json" flac "glitch-$(printf %02d ${{ matrix.i }}).json" "${{ inputs.model }}" 2> err.txt || { echo "::error::$(tail -c 600 err.txt | tr '\n' ' ')"; exit 1; }
      - name: Upload report
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          sleep $(( ${{ matrix.i }} * 5 ))
          bash tools/rel.sh up "${{ inputs.tag }}" glitch-*.json 2> up.err || { echo "::error::upload failed: $(head -c 300 up.err)"; exit 1; }
