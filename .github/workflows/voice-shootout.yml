name: voice-shootout
# Same hard lines (tools/skip-voice/shootout/{skip,dre}.json), same locked reference clips, different engines/settings.
# Output: release <tag>, files <engine>_u###.wav, scored afterwards with tools/skip-voice/voice_gate.py.
on:
  workflow_dispatch:
    inputs:
      tag: {description: "release tag", required: true, default: "shootout1"}
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release view "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" || gh release create "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" --draft -t voice-shootout -n "engine shootout"
  vox:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        who: [skip, dre]
        setting: ["t30_c2", "t30_c15", "t25_c25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg libsndfile1 >/dev/null
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q voxcpm soundfile numpy
      - run: |
          S="${{ matrix.setting }}"; STEPS=${S#t}; STEPS=${STEPS%%_*}; C=${S##*_c}; CFG=$(python -c "print('$C'[0]+'.'+('$C'[1:] or '0'))")
          echo "steps $STEPS cfg $CFG"
          VOX_STEPS=$STEPS VOX_CFG=$CFG python tools/sleep-story/eng_units_voxcpm.py tools/skip-voice/shootout/${{ matrix.who }}.json tools/skip-voice/lock/ref_${{ matrix.who }}.wav tools/skip-voice/lock/ref_${{ matrix.who }}.txt 0 1 out 2>&1 | tee log.txt
          mkdir -p up; for f in out/*.wav; do cp "$f" "up/vox${S}_$(basename $f)"; done; cp log.txt "up/vox${S}_${{ matrix.who }}.log"
      - if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release upload "${{ inputs.tag }}" up/* --clobber -R "$GITHUB_REPOSITORY"
  pocket:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q pocket-tts scipy --extra-index-url https://download.pytorch.org/whl/cpu
      - run: |
          mkdir -p up
          python - <<'EOF' 2>&1 | tee up/pocket.log
          import json, time, scipy.io.wavfile
          from pocket_tts import TTSModel
          t0 = time.time(); m = TTSModel.load_model(); print("load", round(time.time() - t0), "s", flush=True)
          for who in ("skip", "dre"):
              st = m.get_state_for_audio_prompt(f"tools/skip-voice/lock/ref_{who}.wav")
              for u in json.load(open(f"tools/skip-voice/shootout/{who}.json")):
                  t0 = time.time(); a = m.generate_audio(st, u["text"])
                  scipy.io.wavfile.write(f"up/pocket_u{u['idx']:03d}.wav", m.sample_rate, a.numpy())
                  print(who, u["idx"], round(time.time() - t0, 1), "s", round(len(a) / m.sample_rate, 1), "s audio", flush=True)
          EOF
      - if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release upload "${{ inputs.tag }}" up/* --clobber -R "$GITHUB_REPOSITORY"
  moss:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg libsndfile1 >/dev/null
          git clone --depth 1 https://github.com/OpenMOSS/MOSS-TTS-Nano.git moss
          cd moss && (pip install -q -r requirements.txt || true) && (pip install -q -e . || true) && pip install -q onnxruntime soundfile
          head -60 LICENSE || true
      - run: |
          mkdir -p up
          python - <<'EOF' 2>&1 | tee up/moss.log
          import json, subprocess, time, shutil, glob, os
          os.chdir("moss")
          for who in ("skip", "dre"):
              for u in json.load(open(f"../tools/skip-voice/shootout/{who}.json")):
                  t0 = time.time()
                  r = subprocess.run(["python", "infer_onnx.py", "--prompt-audio-path", f"../tools/skip-voice/lock/ref_{who}.wav", "--text", u["text"]], capture_output=True, text=True)
                  print(who, u["idx"], r.returncode, round(time.time() - t0, 1), "s", r.stderr[-400:], flush=True)
                  outs = sorted(glob.glob("generated_audio/*.wav"), key=os.path.getmtime)
                  if outs: shutil.copy(outs[-1], f"../up/moss_u{u['idx']:03d}.wav")
          EOF
      - if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release upload "${{ inputs.tag }}" up/* --clobber -R "$GITHUB_REPOSITORY"
