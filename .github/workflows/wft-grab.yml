name: wft-grab
# Pull finished Freebeat renders (public URLs, space separated "name=url") into tools/wft/clips/.
on:
  workflow_dispatch:
    inputs:
      items:
        required: true
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/wft
          sparse-checkout-cone-mode: false
          filter: blob:none
      - run: |
          mkdir -p tools/wft/clips
          for it in ${{ inputs.items }}; do n="${it%%=*}"; u="${it#*=}"; curl -fsSL -o "tools/wft/clips/$n" "$u" && ls -la "tools/wft/clips/$n"; done
          git config user.name wft-bot; git config user.email wft-bot@users.noreply.github.com
          git add --sparse tools/wft/clips
          git commit -qm "wft grab clips"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
