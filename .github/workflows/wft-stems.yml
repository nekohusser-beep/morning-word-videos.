name: wft-stems
# FREE: split the Word For Today chorus into vocals / music (Demucs htdemucs) so lip sync reads only the voice.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stems:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg libsndfile1 >/dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Demucs
        run: |
          python -m pip install -q "torch==2.5.1" "torchaudio==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q --no-deps "demucs==4.0.1"
          python -m pip install -q dora-search einops julius lameenc openunmix pyyaml tqdm soundfile numpy
      - name: Split
        run: |
          python -m demucs --two-stems vocals -n htdemucs -d cpu -o sep tools/wft/chorus-30s.mp3
          V=$(find sep -name vocals.wav | head -1); B=$(find sep -name no_vocals.wav | head -1)
          ffmpeg -y -v error -i "$V" -ar 44100 -b:a 192k tools/wft/chorus-30s-vocals.mp3
          ffmpeg -y -v error -i "$B" -ar 44100 -b:a 192k tools/wft/chorus-30s-music.mp3
          ls -la tools/wft
      - name: Commit
        run: |
          git config user.name wft-bot; git config user.email wft-bot@users.noreply.github.com
          git add tools/wft/*.mp3
          git commit -qm "wft chorus stems"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
