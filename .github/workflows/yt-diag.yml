name: yt-diag
# Diagnoses the YouTube upload credentials and writes the result to the "inbox" release so it can be read without Actions logs.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q google-api-python-client google-auth
          python3 - <<'PY' > diag.txt 2>&1 || true
          import os, traceback
          print("secrets present:", {k: bool(os.environ.get(k)) for k in ("YT_CLIENT_ID","YT_CLIENT_SECRET","YT_REFRESH_TOKEN")})
          try:
              from google.oauth2.credentials import Credentials
              from google.auth.transport.requests import Request
              from googleapiclient.discovery import build
              c = Credentials(None, refresh_token=os.environ["YT_REFRESH_TOKEN"], token_uri="https://oauth2.googleapis.com/token",
                              client_id=os.environ["YT_CLIENT_ID"], client_secret=os.environ["YT_CLIENT_SECRET"])
              c.refresh(Request()); print("token refresh OK")
              yt = build("youtube", "v3", credentials=c)
              r = yt.channels().list(part="snippet", mine=True).execute()
              print("channels:", [i["snippet"]["title"] for i in r.get("items", [])])
          except Exception as e:
              print("ERROR:", repr(e)); traceback.print_exc()
          PY
          curl -sSIL -o /dev/null -w "john url http %{http_code} size %{size_download}\n" "https://github.com/${{ github.repository }}/releases/download/sleep-john-video/John_KJV_Sleep.mp4" >> diag.txt 2>&1 || true
          cat diag.txt
          gh release upload inbox diag.txt --clobber --repo "${{ github.repository }}"
