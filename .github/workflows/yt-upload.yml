name: yt-upload
# New videos straight onto a channel by the YouTube API (yt-push, profile = which channel).
# Big Skip (Neko Nov 21 2026: all Skip / ADHD comedy goes there). Drop one job JSON per video in
# tools/yt-push/uploads/<profile>/ and push; YouTube holds each one private and makes it public at
# publish_at_utc. Max 5 uploads a run (quota), so a daily run finishes the rest.
on:
  push:
    branches: [main]
    paths: ["tools/yt-push/uploads/*/*.json"]
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "upload = upload queued videos, signin = one-time sign-in code for this channel, check = which channel the saved sign-in is, recent = last 3 days of uploads"
        required: true
        default: upload
        type: choice
        options: [upload, signin, check, recent]
      profile:
        description: "channel: bigskip or bp"
        required: true
        default: bigskip
        type: choice
        options: [bigskip, bp]
permissions:
  contents: write
concurrency:
  group: yt-push
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      MODE: ${{ inputs.mode || 'upload' }}
      YTP_PROFILE: ${{ inputs.profile || 'bigskip' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/yt-push
            reports/yt-push
      - name: Install
        run: pip install -q cryptography
      - name: Run
        shell: bash
        run: |
          mkdir -p reports/yt-push
          OUT="reports/yt-push/run-${{ github.run_id }}-$YTP_PROFILE-$MODE.txt"
          python3 -u tools/yt-push/yt_push.py "$MODE" 2>&1 | tee "$OUT"
          exit "${PIPESTATUS[0]}"
      - name: Scrub and commit the report
        if: always()
        shell: bash
        run: |
          OUT="reports/yt-push/run-${{ github.run_id }}-$YTP_PROFILE-$MODE.txt"
          [ -f "$OUT" ] || exit 0
          for s in "$YT_CLIENT_SECRET" "$YT_CLIENT_ID"; do
            if [ -n "$s" ]; then sed -i "s|$s|[secret]|g" "$OUT"; fi
          done
          git config user.name "yt-push-bot"
          git config user.email "noreply@github.com"
          git add reports/yt-push
          git commit -q -m "yt-upload report ${{ github.run_id }} $YTP_PROFILE $MODE" || exit 0
          for i in 1 2 3 4 5; do git fetch -q --depth=20 origin main && git rebase -q origin/main && git push -q && break; sleep 3; done
