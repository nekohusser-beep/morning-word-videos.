name: ytc-test
on:
  push:
    branches: [test-yt-script]
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r ytc-test/requirements.txt
      - name: Real run, no paid Claude call
        working-directory: ytc-test
        env:
          YT_CHANNEL_ID: UCaKI8Xsi-MHu78UnJTY1xpg
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_PROXY: ${{ secrets.YT_PROXY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - > out.txt 2>&1 <<'PY' || true
          import os, requests
          import yt_to_claude as y
          print("anthropic key secret present:", bool(os.environ.get("ANTHROPIC_API_KEY")))
          print("youtube api key secret present:", bool(os.environ.get("YOUTUBE_API_KEY")))
          ch = y.CHANNEL_ID
          up = "UU" + ch[2:]
          for label, url in [("RSS channel_id", f"https://www.youtube.com/feeds/videos.xml?channel_id={ch}"),
                             ("RSS uploads playlist", f"https://www.youtube.com/feeds/videos.xml?playlist_id={up}")]:
              try:
                  r = requests.get(url, timeout=20, headers={"User-Agent": "Mozilla/5.0"})
                  print(label, "status", r.status_code, "bytes", len(r.content), "entries", r.text.count("<entry>"))
              except Exception as ex:
                  print(label, "FAIL", type(ex).__name__, str(ex)[:120])
          k = os.environ.get("YOUTUBE_API_KEY")
          if k:
              try:
                  r = requests.get("https://www.googleapis.com/youtube/v3/playlistItems", params={"part": "snippet", "playlistId": up, "maxResults": 3, "key": k}, timeout=20)
                  print("Data API playlistItems status", r.status_code)
                  for it in r.json().get("items", []):
                      print("  newest:", it["snippet"]["resourceId"]["videoId"], it["snippet"]["title"][:60])
              except Exception as ex:
                  print("Data API FAIL", type(ex).__name__, str(ex)[:120])
          ok = 0
          ids = [("Q_5x6f9MG7c", "Luke 1 sleep part ~110 min"), ("BFwsZGyPw70", "Psalms 1 sleep part"), ("AXP_5Ih4d9w", "Short love"), ("17ElbISYSsc", "Short sleep")]
          for vid, label in ids:
              try:
                  t = y.get_transcript(vid)
                  ok += 1
                  print("TRANSCRIPT OK", vid, len(t), "chars |", label, "| starts:", t[:70])
              except Exception as ex:
                  print("TRANSCRIPT FAIL", vid, type(ex).__name__, str(ex)[:140].replace("\n", " "), "|", label)
          print("transcripts ok:", ok, "of", len(ids))
          if os.environ.get("ANTHROPIC_API_KEY"):
              import anthropic
              try:
                  c = anthropic.Anthropic(max_retries=0, timeout=30)
                  n = c.messages.count_tokens(model=y.MODEL, messages=[{"role": "user", "content": "test"}])
                  print("ANTHROPIC KEY+MODEL OK (count_tokens, free):", y.MODEL, n.input_tokens)
              except Exception as ex:
                  print("ANTHROPIC CHECK FAIL", type(ex).__name__, str(ex)[:200])
          PY
          echo "::error title=ytc-test result::$(python3 -c "import sys,urllib.parse;print(open('out.txt').read().replace('%','%25').replace('\r','').replace('\n','%0A')[:6000])")"
          exit 1
